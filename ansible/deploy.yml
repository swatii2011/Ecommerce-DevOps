
---
- name: Deploy ShopEasy E-commerce Application
  hosts: webservers
  become: true

  tasks:
    - name: Update Ubuntu package list
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/shopeasy
        state: directory
        mode: "0755"

    - name: Copy application folder to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app"
        dest: /opt/shopeasy/
        mode: "0644"

    - name: Copy Dockerfile to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../Dockerfile"
        dest: /opt/shopeasy/Dockerfile
        mode: "0644"

    - name: Build ShopEasy Docker image
      ansible.builtin.command:
        cmd: docker build -t shopeasy-app /opt/shopeasy

    - name: Remove previous ShopEasy container if present
      ansible.builtin.command:
        cmd: docker rm -f shopeasy-container
      failed_when: false
      changed_when: false

    - name: Start ShopEasy container
      ansible.builtin.command:
        cmd: docker run -d --name shopeasy-container --restart unless-stopped -p 5000:5000 shopeasy-app

    - name: Wait for application port
      ansible.builtin.wait_for:
        port: 5000
        host: 127.0.0.1
        delay: 3
        timeout: 60

    - name: Check application health
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        method: GET
        status_code: 200
